<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Document Converter System</title>
    <style>
        :root { --primary: #0078d4; --bg: #f3f2f1; }
        body { font-family: 'Malgun Gothic', sans-serif; background-color: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        h1 { color: var(--primary); font-size: 1.5rem; margin-bottom: 1.5rem; }
        input[type="password"] { width: 100%; padding: 12px; margin-bottom: 1rem; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #005a9e; }
        .hidden { display: none; }
        .guide-box { text-align: left; background: #f8f9fa; padding: 1rem; border-radius: 6px; margin-top: 1.5rem; font-size: 0.85rem; color: #444; }
        .status-tag { display: inline-block; padding: 2px 8px; background: #dff6dd; color: #107c10; border-radius: 4px; font-size: 0.75rem; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div id="login-section" class="container">
        <h1>🔒 시스템 접속</h1>
        <p style="font-size: 0.9rem; color: #666;">인가된 컨설턴트만 접근 가능합니다.</p>
        <input type="password" id="password" placeholder="비밀번호 입력">
        <button onclick="authenticate()">접속</button>
    </div>

    <div id="dashboard-section" class="container hidden">
        <div class="status-tag">System Authenticated</div>
        <h1>🚀 문서 변환 엔진 생성</h1>
        <p style="font-size: 0.9rem; margin-bottom: 1.5rem;">PPT(X) 및 HWP(X) 일괄 변환 도구를 생성합니다.</p>
        <button onclick="generateAndDownload()">변환 도구(.BAT) 생성 및 다운로드</button>
        
        <div class="guide-box">
            <strong>💡 사용 가이드</strong>
            <ul style="padding-left: 1.2rem; margin-top: 0.5rem;">
                <li>다운로드된 파일을 실행하면 폴더 선택창이 뜹니다.</li>
                <li>오류 발생 시 자동으로 <strong>실패 리스트</strong>가 화면에 표시됩니다.</li>
                <li>로컬에 MS Office 및 한컴오피스가 설치되어 있어야 합니다.</li>
            </ul>
        </div>
    </div>

    <script>
        // 정호님, 여기서 비밀번호 수정이 가능합니다.
        const ACCESS_KEY = "sd*11070823";

        function authenticate() {
            const input = document.getElementById('password').value;
            if (input === ACCESS_KEY) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
            } else {
                alert("인증에 실패했습니다.");
            }
        }

        function generateAndDownload() {
            // PowerShell 로직이 내장된 배치 파일 생성
            const batContent = `@echo off
title Document to PDF Converter
echo 시스템을 초기화 중입니다...
powershell -NoProfile -ExecutionPolicy Bypass -Command ^
"Add-Type -AssemblyName System.Windows.Forms; ^
$f=New-Object System.Windows.Forms.FolderBrowserDialog; $f.Description='[1/2] 원본 폴더 선택 (PPT, HWP)'; ^
if($f.ShowDialog() -ne 'OK'){exit}; $inPath=$f.SelectedPath; ^
$f.Description='[2/2] PDF 저장 폴더 선택'; if($f.ShowDialog() -ne 'OK'){exit}; $outPath=$f.SelectedPath; ^
$pp=New-Object -ComObject PowerPoint.Application; $hwp=New-Object -ComObject HWPFrame.HwpObject; ^
$files=Get-ChildItem -LiteralPath $inPath -Include *.ppt,*.pptx,*.hwp,*.hwpx -File; ^
$errList=@(); ^
foreach($file in $files){ ^
  try { ^
    $save=Join-Path $outPath ([System.IO.Path]::ChangeExtension($file.Name, '.pdf')); ^
    if($file.Extension -like '*ppt*'){$p=$pp.Presentations.Open($file.FullName,-1,0,0); $p.SaveAs($save,32); $p.Close()} ^
    elseif($file.Extension -like '*hwp*'){$hwp.Open($file.FullName,'HWP','forceopen:true'); $hwp.SaveAs($save,'PDF'); $hwp.Clear(1)} ^
    Write-Host '[성공] ' $file.Name -ForegroundColor Green ^
  } catch { ^
    Write-Host '[실패] ' $file.Name -ForegroundColor Red; ^
    $errList += [PSCustomObject]@{파일명=$file.Name; 사유=$_.Exception.Message} ^
  } ^
}; $pp.Quit(); $hwp.Quit(); ^
if($errList.Count -gt 0){ $errList | Out-GridView -Title '⚠️ 변환 실패 리스트 (수동 확인 필요)' }; ^
Write-Host '모든 작업이 완료되었습니다.' -ForegroundColor Yellow; pause"`;

            const blob = new Blob([batContent], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "SmartConverter.bat";
            a.click();
            window.URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
