<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Enterprise Doc Converter - 표준화 센터</title>
    <style>
        :root { --primary: #0078d4; --bg: #f3f2f1; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: var(--white); padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .header { border-bottom: 2px solid var(--primary); margin-bottom: 20px; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .section { margin-bottom: 25px; padding: 15px; border: 1px solid #e1dfdd; border-radius: 8px; }
        .btn { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-download { background: #5c2d91; }
        .btn-run { background: #107c10; width: 100%; font-size: 1.2rem; margin-top: 10px; }
        .btn-run:disabled { background: #c8c6c4; }
        .file-list { max-height: 200px; overflow-y: auto; background: #faf9f8; padding: 10px; border: 1px solid #edebe9; border-radius: 4px; font-size: 0.9rem; margin-top: 10px; line-height: 1.6; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border: 1px solid #edebe9; text-align: left; }
        th { background: #f3f2f1; }
        .status-success { color: #107c10; font-weight: bold; }
        .status-fail { color: #a4262c; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="login" class="container" style="max-width: 400px; margin-top: 100px; text-align: center;">
        <h2>🔐 시스템 접속</h2>
        <input type="password" id="pw" style="width:100%; padding:12px; margin:20px 0; border:1px solid #ddd; border-radius:6px;" placeholder="비밀번호 입력">
        <button class="btn" style="width:100%" onclick="checkAuth()">인증 및 대시보드 진입</button>
    </div>

    <div id="app" class="container hidden">
        <div class="header">
            <h2>🚀 문서 변환 통합 제어 센터</h2>
            <button class="btn btn-download" onclick="downloadBridge()">1. 엔진(Bridge_Server.ps1) 다운로드</button>
        </div>

        <div class="section">
            <strong>2. 변환 대상 설정 (Web Interface)</strong>
            <div style="margin: 15px 0;">
                <button class="btn" onclick="api('select-source')">원본 폴더 선택</button>
                <span id="src-path" style="margin-left:10px; color:#666;">(미선택)</span>
            </div>
            <div id="file-count" style="font-weight:bold;">대상 파일 리스트: 0건</div>
            <div class="file-list" id="file-display">원본 폴더를 선택하면 여기에 파일 목록이 표시됩니다.</div>
            
            <div style="margin: 20px 0 10px 0;">
                <button class="btn" onclick="api('select-dest')">저장 폴더 선택</button>
                <span id="dst-path" style="margin-left:10px; color:#666;">(미선택)</span>
            </div>
        </div>

        <button id="run-btn" class="btn btn-run" onclick="api('convert')" disabled>3. 변환 작업 실행 시작</button>

        <div class="section" style="margin-top:20px;">
            <strong>4. 실시간 변환 리포트</strong>
            <table id="result-table">
                <thead><tr><th>파일명</th><th>상태</th><th>상세 결과</th></tr></thead>
                <tbody><tr><td colspan="3" style="text-align:center; color:#999;">작업 대기 중</td></tr></tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8080";

        function checkAuth() {
            if(document.getElementById('pw').value === "sd*11070823") {
                document.getElementById('login').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
            } else { alert("비밀번호가 일치하지 않습니다."); }
        }

        function downloadBridge() {
            // 가독성을 위해 줄바꿈이 포함된 깨끗한 스크립트 생성
            const psCode = `# Bridge Server for Doc Converter
$listener = New-Object System.Net.HttpListener
$listener.Prefixes.Add("http://localhost:8080/")
try { $listener.Start() } catch { Write-Host "오류: 8080 포트가 이미 사용 중입니다." -ForegroundColor Red; exit }

$srcPath = ""; $dstPath = ""
Write-Host ">>> 로컬 엔진 가동 중 (웹 화면에서 조작하세요) <<<" -ForegroundColor Cyan

while ($listener.IsListening) {
    $context = $listener.GetContext()
    $res = $context.Response
    $res.Headers.Add("Access-Control-Allow-Origin", "*")
    $url = $context.Request.Url.AbsolutePath
    $buffer = [System.Text.Encoding]::UTF8.GetBytes("{}")

    if ($url -eq "/select-source") {
        Add-Type -AssemblyName System.Windows.Forms
        $f = New-Object System.Windows.Forms.FolderBrowserDialog
        if ($f.ShowDialog() -eq "OK") {
            $srcPath = $f.SelectedPath
            $files = Get-ChildItem -LiteralPath $srcPath -Include *.ppt, *.pptx, *.hwp, *.hwpx -File | Select-Object -ExpandProperty Name
            $json = @{ path = $srcPath; files = $files } | ConvertTo-Json
            $buffer = [System.Text.Encoding]::UTF8.GetBytes($json)
        }
    }
    elseif ($url -eq "/select-dest") {
        $f = New-Object System.Windows.Forms.FolderBrowserDialog
        if ($f.ShowDialog() -eq "OK") {
            $dstPath = $f.SelectedPath
            $json = @{ path = $dstPath } | ConvertTo-Json
            $buffer = [System.Text.Encoding]::UTF8.GetBytes($json)
        }
    }
    elseif ($url -eq "/convert") {
        $pp = New-Object -ComObject PowerPoint.Application
        $hwp = New-Object -ComObject HWPFrame.HwpObject
        $results = @()
        $items = Get-ChildItem -LiteralPath $srcPath -Include *.ppt, *.pptx, *.hwp, *.hwpx -File
        foreach ($item in $items) {
            try {
                $out = Join-Path $dstPath ([System.IO.Path]::ChangeExtension($item.Name, ".pdf"))
                if ($item.Extension -match "ppt") {
                    $p = $pp.Presentations.Open($item.FullName, -1, 0, 0)
                    $p.SaveAs($out, 32); $p.Close()
                } else {
                    $hwp.Open($item.FullName, "HWP", "forceopen:true")
                    $hwp.SaveAs($out, "PDF"); $hwp.Clear(1)
                }
                $results += @{ name = $item.Name; status = "성공"; msg = "변환 완료" }
            } catch {
                $results += @{ name = $item.Name; status = "실패"; msg = $_.Exception.Message }
            }
        }
        $pp.Quit(); $hwp.Quit()
        $buffer = [System.Text.Encoding]::UTF8.GetBytes(($results | ConvertTo-Json))
    }
    $res.ContentType = "application/json; charset=utf-8"
    $res.OutputStream.Write($buffer, 0, $buffer.Length)
    $res.Close()
}
`;
            const blob = new Blob([psCode], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "Bridge_Server.ps1";
            a.click();
        }

        async function api(endpoint) {
            try {
                const res = await fetch(`${API_URL}/${endpoint}`);
                const data = await res.json();
                if(endpoint === 'select-source') {
                    document.getElementById('src-path').innerText = data.path;
                    document.getElementById('file-count').innerText = `대상 파일 리스트: ${data.files.length}건`;
                    document.getElementById('file-display').innerHTML = data.files.join('<br>');
                    if(data.files.length > 0) document.getElementById('run-btn').disabled = false;
                } else if(endpoint === 'select-dest') {
                    document.getElementById('dst-path').innerText = data.path;
                } else if(endpoint === 'convert') {
                    renderResults(data);
                }
            } catch { alert("로컬 엔진이 응답하지 않습니다. Bridge_Server.ps1을 실행했는지 확인하세요."); }
        }

        function renderResults(results) {
            const tbody = document.querySelector("#result-table tbody");
            tbody.innerHTML = results.map(r => `<tr><td>${r.name}</td><td class="${r.status === '성공' ? 'status-success' : 'status-fail'}">${r.status}</td><td>${r.msg}</td></tr>`).join('');
        }
    </script>
</body>
</html>
