<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Enterprise Doc Converter - 표준화 센터</title>
    <style>
        :root { --primary: #0078d4; --bg: #f3f2f1; --white: #ffffff; --warn: #fff2f2; }
        body { font-family: 'Malgun Gothic', sans-serif; background: var(--bg); padding: 20px; margin: 0; }
        .container { max-width: 900px; margin: auto; background: var(--white); padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .header { border-bottom: 2px solid var(--primary); margin-bottom: 20px; padding-bottom: 10px; display: flex; justify-content: space-between; }
        .guide { background: var(--warn); border: 1px solid #ff8c8c; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; line-height: 1.6; }
        .section { border: 1px solid #e1dfdd; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .btn { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-run { background: #107c10; width: 100%; font-size: 1.2rem; margin-top: 10px; }
        .btn:disabled { background: #c8c6c4; cursor: not-allowed; }
        .file-list { max-height: 200px; overflow-y: auto; background: #faf9f8; padding: 10px; border: 1px solid #edebe9; border-radius: 4px; font-size: 0.85rem; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border: 1px solid #edebe9; text-align: left; }
        th { background: #f3f2f1; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="login" class="container" style="max-width: 400px; margin-top: 100px; text-align: center;">
        <h2>🔐 시스템 접속</h2>
        <input type="password" id="pw" style="width:100%; padding:12px; margin:20px 0; border:1px solid #ddd; border-radius:6px;" placeholder="비밀번호 입력">
        <button class="btn" style="width:100%" onclick="checkAuth()">접속</button>
    </div>

    <div id="app" class="container hidden">
        <div class="header">
            <h2>🚀 문서 변환 통합 제어 센터</h2>
            <div>
                <button class="btn" style="background:#5c2d91;" onclick="downloadBridge()">1. 엔진(.ps1) 다운로드</button>
                <button class="btn" style="background:#5c2d91;" onclick="downloadBatch()">2. 실행기(.bat) 다운로드</button>
            </div>
        </div>

        <div class="guide">
            <strong>⚠️ 긴급 조치 가이드</strong><br>
            1. 다운로드한 두 파일을 <code>C:\PPT_WORK</code>에 넣으세요.<br>
            2. <strong>서버실행.bat</strong>을 실행해 검은 창이 떠 있어야 합니다.<br>
            3. 주소창 왼쪽 <strong>[자물쇠] -> [사이트 설정] -> [비안전 콘텐츠] -> [허용]</strong> 설정 후 새로고침!
        </div>

        <div class="section">
            <strong>3. 경로 및 리스트 확인</strong>
            <div style="margin: 10px 0;">
                <button class="btn" onclick="api('select-source')">원본 폴더 선택</button>
                <span id="src-path" style="margin-left:10px; color:#666;">(미선택)</span>
            </div>
            <div class="file-list" id="file-display">변환 대상을 확인하세요.</div>
            <button class="btn" style="margin-top:10px;" onclick="api('select-dest')">저장 폴더 선택</button>
            <span id="dst-path" style="margin-left:10px; color:#666;">(미선택)</span>
        </div>

        <button id="run-btn" class="btn btn-run" onclick="api('convert')" disabled>4. 변환 시작</button>

        <table id="result-table">
            <thead><tr><th>파일명</th><th>상태</th><th>결과</th></tr></thead>
            <tbody><tr><td colspan="3" style="text-align:center;">대기 중</td></tr></tbody>
        </table>
    </div>

    <script>
        const API_URL = "http://localhost:8080";

        function checkAuth() {
            if(document.getElementById('pw').value === "sd*11070823") {
                document.getElementById('login').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
            } else { alert("오류"); }
        }

        function downloadBridge() {
            // 줄바꿈 \n을 명시적으로 포함하여 구문 파괴 방지
            const ps = [
                "$OutputEncoding = [System.Text.Encoding]::UTF8",
                "$l = New-Object System.Net.HttpListener",
                "$l.Prefixes.Add('http://localhost:8080/')",
                "try { $l.Start() } catch { Write-Host '8080 포트 충돌' -FG Red; exit }",
                "$s=''; $d=''",
                "Write-Host '>>> 로컬 엔진 가동 중 <<<' -FG Cyan",
                "while($l.IsListening) {",
                "  $c = $l.GetContext(); $res = $c.Response; $res.Headers.Add('Access-Control-Allow-Origin','*')",
                "  $url = $c.Request.Url.AbsolutePath; $buf = [System.Text.Encoding]::UTF8.GetBytes('{}')",
                "  if($url -eq '/select-source') {",
                "    Add-Type -AssemblyName System.Windows.Forms; $f = New-Object System.Windows.Forms.FolderBrowserDialog",
                "    if($f.ShowDialog() -eq 'OK') {",
                "      $s = $f.SelectedPath; $fs = Get-ChildItem -LiteralPath $s -Include *.ppt,*.pptx,*.hwp,*.hwpx -File | Select-Object -ExpandProperty Name",
                "      $buf = [System.Text.Encoding]::UTF8.GetBytes((@{path=$s;files=$fs} | ConvertTo-Json))",
                "    }",
                "  } elseif($url -eq '/select-dest') {",
                "    $f = New-Object System.Windows.Forms.FolderBrowserDialog",
                "    if($f.ShowDialog() -eq 'OK') { $d = $f.SelectedPath; $buf = [System.Text.Encoding]::UTF8.GetBytes((@{path=$d} | ConvertTo-Json)) }",
                "  } elseif($url -eq '/convert') {",
                "    $p = New-Object -ComObject PowerPoint.Application; $h = New-Object -ComObject HWPFrame.HwpObject; $rs = @()",
                "    Get-ChildItem -LiteralPath $s -Include *.ppt,*.pptx,*.hwp,*.hwpx -File | % {",
                "      try {",
                "        $o = [System.IO.Path]::Combine($d, [System.IO.Path]::ChangeExtension($_.Name, '.pdf'))",
                "        if($_.Extension -match 'ppt') { $m=$p.Presentations.Open($_.FullName,-1,0,0); $m.SaveAs($o,32); $m.Close() }",
                "        else { $h.Open($_.FullName,'HWP','forceopen:true'); $h.SaveAs($o,'PDF'); $h.Clear(1) }",
                "        $rs += @{name=$_.Name;status='성공';msg='완료'}",
                "      } catch { $rs += @{name=$_.Name;status='실패';msg=$_.Exception.Message} }",
                "    }; $p.Quit(); $h.Quit(); $buf = [System.Text.Encoding]::UTF8.GetBytes(($rs | ConvertTo-Json))",
                "  }",
                "  $res.ContentType='application/json; charset=utf-8'; $res.OutputStream.Write($buf,0,$buf.Length); $res.Close()",
                "}"
            ].join('\n');
            const blob = new Blob(["\ufeff", ps], { type: 'text/plain;charset=utf-8' });
            save(blob, "Bridge_Server.ps1");
        }

        function downloadBatch() {
            const bat = "@echo off\r\npushd \"%~dp0\"\r\npowershell -NoExit -ExecutionPolicy Bypass -File \"Bridge_Server.ps1\"\r\npause";
            const blob = new Blob([bat], { type: 'application/octet-stream' });
            save(blob, "서버실행.bat");
        }

        function save(b, n) { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = n; a.click(); }

        async function api(e) {
            try {
                const r = await fetch(`${API_URL}/${e}`);
                const d = await r.json();
                if(e==='select-source') {
                    document.getElementById('src-path').innerText = d.path;
                    document.getElementById('file-display').innerHTML = d.files.join('<br>');
                    if(d.files.length > 0) document.getElementById('run-btn').disabled = false;
                } else if(e==='select-dest') { document.getElementById('dst-path').innerText = d.path; }
                else if(e==='convert') { render(d); }
            } catch { alert("엔진 연결 실패! 가이드를 확인하세요."); }
        }

        function render(res) {
            const b = document.querySelector("#result-table tbody");
            b.innerHTML = res.map(r => `<tr><td>${r.name}</td><td>${r.status}</td><td>${r.msg}</td></tr>`).join('');
        }
    </script>
</body>
</html>
