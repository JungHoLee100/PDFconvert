<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Enterprise Doc Standardizer v1.5</title>
    <style>
        :root { --primary: #0078d4; --bg: #f3f2f1; --white: #ffffff; }
        body { font-family: 'Segoe UI', 'Malgun Gothic', sans-serif; background: var(--bg); padding: 20px; margin: 0; }
        .container { max-width: 850px; margin: auto; background: var(--white); padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .header { border-bottom: 2px solid var(--primary); margin-bottom: 20px; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .path-box { background: #fff9e6; border: 1px solid #ffcc00; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 0.95rem; line-height: 1.8; }
        .btn { padding: 12px 24px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-download { background: #5c2d91; font-size: 0.85rem; margin-left: 5px; }
        .btn-run { background: #107c10; width: 100%; height: 55px; font-size: 1.2rem; margin-bottom: 25px; }
        .btn:disabled { background: #c8c6c4; cursor: not-allowed; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border: 1px solid #edebe9; text-align: left; }
        th { background: #f3f2f1; }
        .status-success { color: #107c10; font-weight: bold; }
        .status-fail { color: #a4262c; font-weight: bold; }
    </style>
</head>
<body>
    <div id="login" class="container" style="max-width: 400px; margin-top: 100px; text-align: center;">
        <h2>🔐 시스템 접속</h2>
        <input type="password" id="pw" style="width:100%; padding:12px; margin:20px 0; border:1px solid #ddd; border-radius:6px;" placeholder="비밀번호 입력">
        <button class="btn" style="width:100%" onclick="checkAuth()">인증 및 진입</button>
    </div>

    <div id="app" class="container hidden">
        <div class="header">
            <h2>🚀 문서 통합 변환 센터 (v1.5)</h2>
            <div>
                <button class="btn btn-download" onclick="downloadBridge()">1. 엔진(.ps1)</button>
                <button class="btn btn-download" onclick="downloadBatch()">2. 실행기(.bat)</button>
            </div>
        </div>

        <div class="path-box">
            <strong>📂 필터링 및 작업 안내</strong><br>
            • <b>대상:</b> 6종 문서(PPTX, DOCX, HWPX 등) 전용 변환<br>
            • <b>제외:</b> <b>폴더, 엔진(.ps1), 실행기(.bat)</b> 자동 스킵<br>
            • <b>시각화:</b> 파워쉘 콘솔에서 상태별 색상 로그를 제공합니다.
        </div>

        <button id="run-btn" class="btn btn-run" onclick="runConversion()">변환 작업 실행 (PDF 생성)</button>

        <div style="font-weight: bold; margin-bottom: 10px;">📊 실시간 변환 리포트</div>
        <table id="result-table">
            <thead>
                <tr><th>파일명</th><th>상태</th><th>상세 결과</th></tr>
            </thead>
            <tbody>
                <tr><td colspan="3" style="text-align:center; color:#999;">작업 대기 중...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = "http://localhost:8080";

        function checkAuth() {
            if(document.getElementById('pw').value === "sd*11070823") {
                document.getElementById('login').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
            } else { alert("비밀번호 불일치"); }
        }

        function downloadBridge() {
            const ps = [
                "$OutputEncoding = [System.Text.Encoding]::UTF8",
                "$l = New-Object System.Net.HttpListener; $l.Prefixes.Add('http://localhost:8080/')",
                "try { $l.Start() } catch { Write-Host '[오류] 8080 포트 충돌' -ForegroundColor Red; exit }",
                "$s = 'C:\\ppt_work'; $d = 'C:\\ppt_work\\pdf'",
                "if (!(Test-Path $d)) { New-Item -ItemType Directory -Path $d | Out-Null }",
                "Write-Host '`n==========================================' -ForegroundColor Cyan",
                "Write-Host '>>> 통합 문서 변환 엔진 가동 중 <<<' -ForegroundColor Cyan",
                "Write-Host '==========================================' -ForegroundColor Cyan",
                "while($l.IsListening) {",
                "  $c = $l.GetContext(); $res = $c.Response; $res.Headers.Add('Access-Control-Allow-Origin','*')",
                "  if($c.Request.Url.AbsolutePath -eq '/convert') {",
                "    Write-Host \"`n[신호 수신] 변환 요청 ($((Get-Date).ToString('HH:mm:ss')))\" -ForegroundColor Yellow",
                "    $rs = @()",
                "    $items = Get-ChildItem -LiteralPath $s -File | Where-Object { $_.Extension -match 'ppt|pptx|doc|docx|hwp|hwpx' }",
                "    if($items.Count -gt 0) {",
                "       Write-Host \"  -> 총 $($items.Count)개의 문서 발견\" -ForegroundColor White",
                "       $pp = New-Object -ComObject PowerPoint.Application; $wd = New-Object -ComObject Word.Application; $hwp = New-Object -ComObject HWPFrame.HwpObject",
                "       foreach($i in $items) {",
                "         try {",
                "           $o = [System.IO.Path]::Combine($d, [System.IO.Path]::ChangeExtension($i.Name, '.pdf'))",
                "           Write-Host \"     [*] 진행 중: $($i.Name)\" -NoNewline",
                "           if($i.Extension -match 'ppt') {",
                "             $m=$pp.Presentations.Open($i.FullName,-1,0,0); $m.SaveAs($o,32); $m.Close()",
                "           } elseif($i.Extension -match 'doc') {",
                "             $doc=$wd.Documents.Open($i.FullName, $false, $true); $doc.ExportAsFixedFormat($o, 17); $doc.Close(0)",
                "           } else {",
                "             $hwp.Open($i.FullName,'HWP','forceopen:true'); $hwp.SaveAs($o,'PDF'); $hwp.Clear(1)",
                "           }",
                "           $rs += @{name=$i.Name; status='성공'; msg='완료'}",
                "           Write-Host \" [완료]\" -ForegroundColor Green",
                "         } catch {",
                "           $rs += @{name=$i.Name; status='실패'; msg=$_.Exception.Message}",
                "           Write-Host \" [실패]\" -ForegroundColor Red",
                "         }",
                "       }",
                "       $pp.Quit(); $wd.Quit(); $hwp.Quit()",
                "    } else { Write-Host '  ! 변환 대상 문서가 없습니다.' -ForegroundColor Magenta }",
                "    $json = @($rs) | ConvertTo-Json",
                "    if ($null -eq $json) { $json = '[]' }",
                "    $buf = [System.Text.Encoding]::UTF8.GetBytes($json)",
                "    $res.ContentType='application/json; charset=utf-8'; $res.OutputStream.Write($buf, 0, $buf.Length)",
                "    Write-Host '[응답 전송] 완료.' -ForegroundColor Cyan",
                "  }",
                "  $res.Close()",
                "}"
            ].join('\n');
            saveBlob(new Blob(["\ufeff", ps], { type: 'text/plain;charset=utf-8' }), "Bridge_Server.ps1");
        }

        function downloadBatch() {
            const bat = "@echo off\r\nchcp 65001 > nul\r\npowershell -NoExit -ExecutionPolicy Bypass -File \"Bridge_Server.ps1\"";
            saveBlob(new Blob([bat], { type: 'application/octet-stream' }), "서버실행.bat");
        }

        function saveBlob(blob, name) {
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
        }

        async function runConversion() {
            const btn = document.getElementById('run-btn');
            const tbody = document.querySelector("#result-table tbody");
            btn.disabled = true;
            tbody.innerHTML = "<tr><td colspan='3' style='text-align:center;'>🔄 변환 진행 중... (PowerShell 창에서 색상별 진행 상황을 확인하세요)</td></tr>";

            try {
                const res = await fetch(`${API_URL}/convert`);
                const results = await res.json();
                const data = Array.isArray(results) ? results : (results ? [results] : []);
                
                if (data.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='3' style='text-align:center;'>대상 문서 파일이 없습니다.</td></tr>";
                } else {
                    tbody.innerHTML = data.map(r => `<tr>
                        <td>${r.name}</td>
                        <td class="${r.status === '성공' ? 'status-success' : 'status-fail'}">${r.status}</td>
                        <td>${r.msg}</td>
                    </tr>`).join('');
                }
            } catch (e) {
                tbody.innerHTML = "<tr><td colspan='3' style='text-align:center; color:red;'>⚠️ 엔진 응답 없음.</td></tr>";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
