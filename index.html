<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Enterprise Document Standardizer</title>
    <style>
        :root { --primary: #0078d4; --success: #107c10; --error: #d13438; }
        body { font-family: 'Segoe UI', sans-serif; background: #f3f2f1; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 450px; text-align: center; }
        h2 { color: var(--primary); margin-bottom: 20px; }
        input[type="password"] { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        button:hover { background: #005a9e; }
        .guide { text-align: left; font-size: 0.85rem; color: #666; margin-top: 20px; line-height: 1.5; }
        .hidden { display: none; }
        .step-tag { background: #dff6dd; color: var(--success); padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    </style>
</head>
<body>
    <div id="auth-box" class="card">
        <h2>🔒 시스템 인증</h2>
        <input type="password" id="pw" placeholder="비밀번호 입력">
        <button onclick="login()">인증 및 시스템 접속</button>
    </div>

    <div id="main-box" class="card hidden">
        <span class="step-tag">Ready to Convert</span>
        <h2>🚀 문서 변환 시스템</h2>
        <p style="font-size: 0.9rem; color: #444;">아래 버튼을 클릭하여 변환 엔진을 실행하세요.</p>
        <button onclick="downloadEngine()">변환 엔진 다운로드</button>
        <div class="guide">
            <strong>📋 실행 프로세스 (5대 요구사항 반영)</strong>
            <ol>
                <li>다운로드된 파일을 실행합니다.</li>
                <li>화면에 뜨는 <strong>폴더 선택창</strong>에서 변환할 폴더를 선택합니다.</li>
                <li>저장될 폴더를 선택하면 <strong>PPT/HWP 일괄 변환</strong>이 시작됩니다.</li>
                <li>작업 완료 후 <strong>성공/실패 리포트 창</strong>이 유지됩니다.</li>
            </ol>
        </div>
    </div>

    <script>
        const MASTER_KEY = "sd*11070823";

        function login() {
            if(document.getElementById('pw').value === MASTER_KEY) {
                document.getElementById('auth-box').classList.add('hidden');
                document.getElementById('main-box').classList.remove('hidden');
            } else { alert("비밀번호가 올바르지 않습니다."); }
        }

        function downloadEngine() {
            const psScript = `
Add-Type -AssemblyName System.Windows.Forms
$f=New-Object System.Windows.Forms.FolderBrowserDialog

# 2~3. 폴더 선택 (UI)
$f.Description = '변환할 원본 폴더를 선택하세요 (PPT, HWP)'; if($f.ShowDialog() -ne 'OK'){exit}; $in=$f.SelectedPath
$f.Description = 'PDF를 저장할 폴더를 선택하세요'; if($f.ShowDialog() -ne 'OK'){exit}; $out=$f.SelectedPath

# 1. 엔진 기동
$pp=New-Object -ComObject PowerPoint.Application; $hwp=New-Object -ComObject HWPFrame.HwpObject; $res=@()

# 4. 변환 실행
$files = Get-ChildItem -LiteralPath $in -Include *.ppt,*.pptx,*.hwp,*.hwpx -File
foreach($file in $files){
    try {
        $save=Join-Path $out ([System.IO.Path]::ChangeExtension($file.Name, '.pdf'))
        if($file.Extension -like '*ppt*'){
            $p=$pp.Presentations.Open($file.FullName,-1,0,0); $p.SaveAs($save,32); $p.Close()
        } elseif($file.Extension -like '*hwp*'){
            $hwp.Open($file.FullName,'HWP','forceopen:true'); $hwp.SaveAs($save,'PDF'); $hwp.Clear(1)
        }
        $res += [PSCustomObject]@{파일명=$file.Name; 결과='성공'; 메시지='PDF 변환 완료'}
    } catch {
        $res += [PSCustomObject]@{파일명=$file.Name; 결과='실패'; 메시지=$_.Exception.Message}
    }
}
$pp.Quit(); $hwp.Quit()

# 5. 결과 리포트 출력 (창 유지)
$res | Out-GridView -Title '변환 성공/실패 결과 리포트'
Write-Host '모든 작업이 완료되었습니다. 창을 닫으려면 아무 키나 누르세요.' -ForegroundColor Yellow
Read-Host
`;
            const batContent = `@echo off\npowershell -NoProfile -ExecutionPolicy Bypass -Command "${psScript.replace(/"/g, '"""').replace(/\n/g, ' ')}"\npause`;
            const blob = new Blob([batContent], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "DocumentConverter_Pro.bat";
            a.click();
        }
    </script>
</body>
</html>
