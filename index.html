<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Enterprise Doc Standardizer (Fixed Path)</title>
    <style>
        :root { --primary: #0078d4; --bg: #f3f2f1; --white: #ffffff; }
        body { font-family: 'Segoe UI', 'Malgun Gothic', sans-serif; background: var(--bg); padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: auto; background: var(--white); padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .header { border-bottom: 2px solid var(--primary); margin-bottom: 20px; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .path-info { background: #fff9e6; border: 1px solid #ffcc00; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 0.95rem; line-height: 1.8; }
        .btn { padding: 12px 24px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        .btn-run { background: #107c10; width: 100%; height: 50px; margin-bottom: 20px; }
        .btn-run:disabled { background: #c8c6c4; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border: 1px solid #edebe9; text-align: left; }
        th { background: #f3f2f1; font-weight: 600; }
        .status-success { color: #107c10; font-weight: bold; }
        .status-fail { color: #a4262c; font-weight: bold; }
        code { background: #eee; padding: 2px 5px; border-radius: 4px; color: #d13438; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="login" class="container" style="max-width: 400px; margin-top: 100px; text-align: center;">
        <h2>🔐 시스템 접속</h2>
        <input type="password" id="pw" style="width:100%; padding:12px; margin:20px 0; border:1px solid #ddd; border-radius:6px;" placeholder="비밀번호 입력">
        <button class="btn" style="width:100%" onclick="checkAuth()">인증 및 진입</button>
    </div>

    <div id="app" class="container hidden">
        <div class="header">
            <h2>🚀 문서 변환 자동화 시스템</h2>
            <button class="btn" style="background:#5c2d91; font-size: 0.8rem;" onclick="downloadBridge()">엔진 다운로드</button>
        </div>

        <div class="path-info">
            <strong>📂 작업 경로 안내 (고정됨)</strong><br>
            • 원본 위치: <code>C:\ppt_work</code> 에 파일을 넣으세요.<br>
            • 변환 결과: <code>C:\ppt_work\pdf</code> 폴더에 생성됩니다.
        </div>

        <button id="run-btn" class="btn btn-run" onclick="runConversion()">변환 작업 시작</button>

        <div style="font-weight: bold; margin-bottom: 10px;">📊 변환 결과 리포트</div>
        <table id="result-table">
            <thead>
                <tr><th>파일명</th><th>상태</th><th>상세 결과</th></tr>
            </thead>
            <tbody>
                <tr><td colspan="3" style="text-align:center; color:#999;">작업을 대기 중입니다.</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = "http://localhost:8080";

        function checkAuth() {
            if(document.getElementById('pw').value === "sd*11070823") {
                document.getElementById('login').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
            } else { alert("비밀번호 불일치"); }
        }

        function downloadBridge() {
            const ps = [
                "$OutputEncoding = [System.Text.Encoding]::UTF8",
                "$l = New-Object System.Net.HttpListener",
                "$l.Prefixes.Add('http://localhost:8080/')",
                "try { $l.Start() } catch { Write-Host '포트 충돌' -FG Red; exit }",
                "$s = 'C:\\ppt_work'",
                "$d = 'C:\\ppt_work\\pdf'",
                "if (!(Test-Path $d)) { New-Item -ItemType Directory -Path $d }",
                "Write-Host '>>> 문서 변환 엔진 가동 중 <<<' -FG Cyan",
                "while($l.IsListening) {",
                "  $c = $l.GetContext(); $res = $c.Response; $res.Headers.Add('Access-Control-Allow-Origin','*')",
                "  if($c.Request.Url.AbsolutePath -eq '/convert') {",
                "    $p = New-Object -ComObject PowerPoint.Application; $h = New-Object -ComObject HWPFrame.HwpObject; $rs = @()",
                "    $items = Get-ChildItem -LiteralPath $s -Include *.ppt,*.pptx,*.hwp,*.hwpx -File",
                "    foreach($i in $items) {",
                "      try {",
                "        $o = Join-Path $d ([System.IO.Path]::ChangeExtension($i.Name, '.pdf'))",
                "        if($i.Extension -match 'ppt') { $m=$p.Presentations.Open($i.FullName,-1,0,0); $m.SaveAs($o,32); $m.Close() }",
                "        else { $h.Open($i.FullName,'HWP','forceopen:true'); $h.SaveAs($o,'PDF'); $h.Clear(1) }",
                "        $rs += @{name=$i.Name;status='성공';msg='완료'}",
                "      } catch { $rs += @{name=$i.Name;status='실패';msg=$_.Exception.Message} }",
                "    }",
                "    $p.Quit(); $h.Quit(); $buf = [System.Text.Encoding]::UTF8.GetBytes(($rs | ConvertTo-Json))",
                "    $res.ContentType='application/json; charset=utf-8'; $res.OutputStream.Write($buf,0,$buf.Length)",
                "  }",
                "  $res.Close()",
                "}"
            ].join('\n');
            const blob = new Blob(["\ufeff", ps], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "Bridge_Server.ps1"; a.click();
        }

        async function runConversion() {
            const btn = document.getElementById('run-btn');
            const tbody = document.querySelector("#result-table tbody");
            
            btn.disabled = true;
            tbody.innerHTML = "<tr><td colspan='3' style='text-align:center;'>변환 중... 잠시만 기다려 주세요.</td></tr>";

            try {
                const res = await fetch(`${API_URL}/convert`);
                const results = await res.json();
                tbody.innerHTML = results.map(r => `<tr>
                    <td>${r.name}</td>
                    <td class="${r.status === '성공' ? 'status-success' : 'status-fail'}">${r.status}</td>
                    <td>${r.msg}</td>
                </tr>`).join('');
            } catch (e) {
                alert("엔진 연결 실패! Bridge_Server.ps1이 실행 중인지, 브라우저 보안 설정(비안전 콘텐츠 허용)을 마쳤는지 확인하세요.");
                tbody.innerHTML = "<tr><td colspan='3' style='text-align:center; color:red;'>연결 실패</td></tr>";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
